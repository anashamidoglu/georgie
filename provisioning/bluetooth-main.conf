# BlueZ configuration for Georgie Carputer Hands-Free Audio Gateway
# Place at /etc/bluetooth/main.conf

[General]
Name = Georgie
# Class 0x200408 = Audio/Video (Handsfree device + Car Audio)
Class = 0x200408
DiscoverableTimeout = 0
PairableTimeout = 0
AutoEnable = true
MultiProfile = multiple
FastConnectable = true
JustWorksRepairing = always

[Policy]
AutoEnable = true
ReconnectAttempts = 7
ReconnectIntervals = 1, 2, 4, 8, 16, 32, 64

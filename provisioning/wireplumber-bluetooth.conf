# WirePlumber Bluetooth Configuration for Georgie Carputer
# Disables audio stream autosuspend so Bluetooth connection never drops during silence/idle
# Place at /etc/wireplumber/wireplumber.conf.d/50-bluez.conf

monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source hfp_hf hfp_ag ]
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.autoswitch-to-headset-profile = false
}

monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
      }
    }
  }
]
